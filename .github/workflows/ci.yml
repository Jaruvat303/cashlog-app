name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  FLUTTER_VERSION: "3.47.2"

jobs:
  analyze-and-test:
    name: Analyze & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # จำเป็นเพราะ Riverpod + drift ใช้ codegen (@riverpod, DriftDatabase)
      - name: Run build_runner (codegen)
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed $(git ls-files '*.dart' | grep -v '\.g\.dart$')

      - name: Analyze
        run: flutter analyze --fatal-infos

      - name: Run tests
        run: flutter test --coverage --exclude-tags smoke

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/lcov.info
          retention-days: 14

  build-apk:
    name: Build APK (dev)
    needs: analyze-and-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run build_runner (codegen)
        run: dart run build_runner build --delete-conflicting-outputs

      # This job is a compile check only — its APK is never uploaded (the repo
      # is public, and an uploaded release APK embeds whatever --dart-define
      # values built it, so a real DEV_API_KEY there would leak). Dummy values
      # exercise the exact same build path without needing real secrets.
      - name: Prepare env file
        run: |
          mkdir -p env
          cat <<EOF > env/dev.json
          {
            "BASE_URL": "https://example.invalid",
            "API_KEY": "ci-dummy"
          }
          EOF

      # --no-tree-shake-icons: post-launch UI polish ticket 09 made category
      # icon resolution build `IconData` from a runtime-looked-up codepoint
      # (see lib/shared/widgets/category_icon.dart) instead of only ever
      # referencing compile-time-constant `RemixIcon.xxxFill` identifiers.
      # Flutter's release-build icon tree-shaker hard-fails
      # ("Avoid non-constant invocations of IconData...") the moment any
      # dynamically-constructed IconData is reachable, since it can't
      # statically know which glyphs are actually used. This flag ships the
      # full Remix Icon font (~592KB uncompressed) instead of a tree-shaken
      # subset — the trade-off for a category icon set that no longer needs
      # a frontend code change every time the backend adds a category.
      - name: Build APK
        run: flutter build apk --release --dart-define-from-file=env/dev.json --no-tree-shake-icons