name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  FLUTTER_VERSION: "3.24.0"

jobs:
  analyze-and-test:
    name: Analyze & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # จำเป็นเพราะ Riverpod + drift ใช้ codegen (@riverpod, DriftDatabase)
      - name: Run build_runner (codegen)
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze
        run: flutter analyze --fatal-infos

      - name: Run tests
        run: flutter test --coverage

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/lcov.info
          retention-days: 14

  build-apk:
    name: Build APK (dev)
    needs: analyze-and-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run build_runner (codegen)
        run: dart run build_runner build --delete-conflicting-outputs

      # สร้างไฟล์ env จาก GitHub Secrets แทนการ commit ค่าจริง
      - name: Prepare env file
        run: |
          mkdir -p env
          cat <<EOF > env/dev.json
          {
            "BASE_URL": "${{ secrets.DEV_BASE_URL }}",
            "API_KEY": "${{ secrets.DEV_API_KEY }}"
          }
          EOF

      - name: Build APK
        run: flutter build apk --release --dart-define-from-file=env/dev.json

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: cashlog-app-dev
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14