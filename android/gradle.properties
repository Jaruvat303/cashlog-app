# -Duser.language=en -Duser.country=US is the actual fix for a real build
# failure (not a hygiene tweak): with this machine's default JVM locale
# (th-TH, i.e. Thai, seen on the Gradle daemon's own command line), assembleDebug
# fails every time at :app:mergeDebugJavaResource with
# `com.google.common.base.VerifyException` deep inside
# `com.android.tools.build.apkzlib.zip.utils.MsDosDateTimeUtils.packDate` — ZIP's
# MS-DOS date format only supports years 1980-2107, and something in that call
# path computes "now" as a Thai Buddhist Era year (2026 CE -> 2569 BE), which is
# out of range. Forcing the Gradle JVM to en-US sidesteps the Buddhist-calendar
# year computation entirely. Confirmed directly: `./gradlew
# :app:mergeDebugJavaResource --stacktrace` fails without this flag and succeeds
# with it, on both JDK 20 and JDK 21 — so this, not the JDK version below, is
# what actually unblocks the build.
org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError -Duser.language=en -Duser.country=US
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
